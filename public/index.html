<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rewind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="nav">
  <div class="logo">Rewind</div>
  <div class="tabs">
    <a href="/login.html">Login</a>
    <a href="/signup.html">Sign Up</a>
    <a href="/profile.html">Profile</a>
  </div>
</div>

<div class="container">
  <h1>Rewind Hub</h1>

  <div class="card">🧭 Rooms (coming soon)</div>
  <div class="card">🛍️ Shop (coming soon)</div>

  <div class="card">
    📢 News
    <pre id="news">Loading...</pre>
  </div>
</div>

<script>
async function loadNews() {
  const res = await fetch("/api/news");
  const data = await res.json();

  document.getElementById("news").innerText =
    JSON.stringify(data.news, null, 2);
}

loadNews();
setInterval(loadNews, 5000);
</script>

</body>
</html>
